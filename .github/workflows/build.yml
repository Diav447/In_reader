name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
      - name: Setup project
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            flutter create . --project-name ln_reader --org com.example --platforms android
          fi
          if [ ! -d "android" ]; then
            flutter create . --project-name ln_reader --org com.example --platforms android
          fi
          # FIX AndroidManifest - remove broken permission and add correct one
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          echo "BEFORE:" && cat "$MANIFEST"
          # hapus semua permission internet yang salah tempat
          sed -i '/uses-permission/d' "$MANIFEST"
          # tambah yang bener sebelum <application
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <application/' "$MANIFEST"
          echo "AFTER:" && cat "$MANIFEST"
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
