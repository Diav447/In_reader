name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
      - name: Create Flutter Project if needed
        run: |
          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            flutter create . --project-name ln_reader --org com.example --platforms android
          fi
          # inject internet permission
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<application/a \    <uses-permission android:name="android.permission.INTERNET" \/>' "$MANIFEST" || true
            # fallback inject before <application>
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <application/' "$MANIFEST"
          fi
          cat "$MANIFEST"
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
